name: sahalat_owner
description: Sahalat Owner – Admin & Commission Management App

version: 1.0.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  gap: ^3.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.4
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: "launch_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
